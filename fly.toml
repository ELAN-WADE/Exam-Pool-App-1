# fly.toml app configuration file generated for exampool

app = "exampool"
primary_region = "iad" # You can change this to a region closest to you

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  EXAMPOOL_DB = "/app/data/exampool.db"

[mounts]
  source = "exampool_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
